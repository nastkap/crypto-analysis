---
# ConfigMap - Konfiguracja systemowa
apiVersion: v1
kind: ConfigMap
metadata:
  name: crypto-config
  namespace: crypto-perf
data:
  # Konfiguracja bazy danych
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: benchmark
  
  # Konfiguracja message brokera
  #REDIS_HOST: message-broker
  #REDIS_PORT: "6379"
  
  # Konfiguracja aplikacji
  LOG_LEVEL: INFO
  UVICORN_WORKERS: "1"
  
  # Konfiguracja węzłów
  NODE_TIMEOUT: "30"
  HEALTH_CHECK_INTERVAL: "10"

---
# Secret - Poufne dane (hasła, klucze)
apiVersion: v1
kind: Secret
metadata:
  name: crypto-secrets
  namespace: crypto-perf
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: benchmark
  POSTGRES_PASSWORD: benchmark
  POSTGRES_DB: benchmark
  DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/benchmark
  
  # Redis URL
  BROKER_URL: redis://:redis-password@message-broker:6379
  # REDIS_PASSWORD: redis-password
  
  # API Keys (jeśli będą potrzebne)
  SECRET_KEY: "your-super-secret-key-change-in-production"
  ALGORITHM: "HS256"
