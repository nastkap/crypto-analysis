---
# Deployment: Benchmark Controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-controller
  namespace: crypto-perf
  labels:
    app: benchmark-controller
    component: controller
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: benchmark-controller
  template:
    metadata:
      labels:
        app: benchmark-controller
        component: controller
    spec:
      serviceAccountName: crypto-system
      containers:
      - name: benchmark-controller
        image: nastap/controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: crypto-config
        - secretRef:
            name: crypto-secrets
        env:
        - name: NODE_NAME
          value: benchmark-controller
        - name: REDIS_HOST
          value: message-broker
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: redis-password
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-controller
  namespace: crypto-perf
  labels:
    app: benchmark-controller
    component: controller
spec:
  type: ClusterIP
  selector:
    app: benchmark-controller
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http

