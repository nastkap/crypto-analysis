---
# Resource Quota - Limituje zasoby dla całego namespace crypto-perf
# Zapobiega nadmiernemu zużyciu zasobów przez cały system
apiVersion: v1
kind: ResourceQuota
metadata:
  name: crypto-quota
  namespace: crypto-perf
  labels:
    app: crypto-system
spec:
  hard:
    # CPU limits
    requests.cpu: "4"             
    limits.cpu: "12"                
    
    # Memory limits
    requests.memory: "8Gi"       
    limits.memory: "20Gi"          
    
    # Pod count
    pods: "20"                     
    
    # Services
    services: "10"                 
    services.loadbalancers: "2"    
    
    # Persistent Volumes
    persistentvolumeclaims: "5"    

---
# Limits Range - Default resource requests/limits dla podów bez specyfiki

apiVersion: v1
kind: LimitRange
metadata:
  name: crypto-limits
  namespace: crypto-perf
spec:
  limits:
  # Container limits
  - type: Container
    default:        
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    min:            
      cpu: 10m
      memory: 32Mi
    max:            
      cpu: 4000m
      memory: 8Gi
  
  # Pod limits (sum of containers)
  - type: Pod
    max:
      cpu: 4000m
      memory: 8Gi
    min:
      cpu: 10m
      memory: 32Mi
