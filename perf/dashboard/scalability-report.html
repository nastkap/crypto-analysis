<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scalability Report Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f5f2ea;
      --ink: #1b1f24;
      --muted: #5d6672;
      --panel: #fffdf8;
      --line: #e9e2d3;
      --shadow: 0 14px 32px rgba(39, 33, 18, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 0% 0%, #ece7db 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, #efe9da 0%, transparent 35%),
        var(--bg);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 16px 40px; }
    .hero {
      background: linear-gradient(120deg, #fcf6e7 0%, #fffdf7 40%, #eef6f5 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 2.5vw, 2rem); }
    .subtitle { margin: 0; color: var(--muted); }
    .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 16px 0 0; }
    .control-group { display: flex; gap: 10px; align-items: center; }
    .control-group label { font-weight: 600; }
    select {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
    .badge { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: inline-block; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .card {
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 16px; font-size: 1.1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: rgba(27, 31, 36, 0.05); font-weight: 600; }
    tr:hover { background: rgba(27, 31, 36, 0.02); }
    .metric-good { color: #1c7c7d; font-weight: 600; }
    .metric-warn { color: #a57c1b; font-weight: 600; }
    .metric-bad { color: #c1482e; font-weight: 600; }
    .payload-section { margin-bottom: 24px; }
    .chart-card { padding: 12px 16px 6px; }
    canvas { max-height: 320px; }
    @media (max-width: 900px) {
      th, td { padding: 8px; font-size: 12px; }
      .controls { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Scalability Test Report</h1>
      <p class="subtitle">Wyniki testu skalowalności z ramping VU dla wybranej biblioteki</p>
      <div class="controls">
        <div class="control-group">
          <label for="librarySelect">Biblioteka:</label>
          <select id="librarySelect"></select>
        </div>
        <span class="badge" id="payloadBadge">Payloads: -</span>
      </div>
    </section>

    <div class="grid" id="contentContainer">
      <!-- Dynamicznie generowane -->
    </div>
  </div>

<script>
const allResults = {"CPP_CryptoPP": {"1": {"payload_bytes": 1, "iterations": 24514, "http_req_duration_med": 5.5483, "http_req_duration_p90": 48.63906, "http_req_duration_p95": 50.73842, "http_req_duration_avg": 17.832719325297195, "http_reqs_rate": 233.37578395162905, "http_req_failed_rate": 0.0, "iteration_duration_avg": 136.53405409561825, "round_trip_duration_avg": 36.16692502243616, "vus_max": 30.0}, "10485760": {"payload_bytes": 10485760, "iterations": 215, "http_req_duration_med": 4503.61, "http_req_duration_p90": 31768.96808000002, "http_req_duration_p95": 34776.5412, "http_req_duration_avg": 10421.066300634924, "http_reqs_rate": 1.361073679316474, "http_req_failed_rate": 0.0, "iteration_duration_avg": 15357.197840930236, "round_trip_duration_avg": 13190.924528301886, "vus_max": 30.0}, "104857600": {"payload_bytes": 104857600, "iterations": 118, "http_req_duration_med": 0.0, "http_req_duration_p90": 14888.08313, "http_req_duration_p95": 17086.758414999997, "http_req_duration_avg": 3256.5486933333327, "http_reqs_rate": 0.5218581059147174, "http_req_failed_rate": 0.0, "iteration_duration_avg": 31437.972672033888, "round_trip_duration_avg": 0.0, "vus_max": 30.0}}, "CPP_OpenSSL": {"1": {"payload_bytes": 1, "iterations": 25389, "http_req_duration_med": 2.737, "http_req_duration_p90": 45.835980000000006, "http_req_duration_p95": 48.06742, "http_req_duration_avg": 15.439463963449475, "http_reqs_rate": 241.6055086912418, "http_req_failed_rate": 0.0, "iteration_duration_avg": 131.8366352436097, "round_trip_duration_avg": 31.388081452597582, "vus_max": 30.0}, "10485760": {"payload_bytes": 10485760, "iterations": 441, "http_req_duration_med": 2100.8615, "http_req_duration_p90": 16939.07529, "http_req_duration_p95": 17971.546865, "http_req_duration_avg": 6506.047417374519, "http_reqs_rate": 2.3329093039484197, "http_req_failed_rate": 0.0, "iteration_duration_avg": 8353.757280272113, "round_trip_duration_avg": 13053.061538461538, "vus_max": 30.0}, "104857600": {"payload_bytes": 104857600, "iterations": 109, "http_req_duration_med": 0.0, "http_req_duration_p90": 13770.9186, "http_req_duration_p95": 15632.98215, "http_req_duration_avg": 2978.316636936937, "http_reqs_rate": 0.49028975140194736, "http_req_failed_rate": 0.0, "iteration_duration_avg": 33583.89449816514, "round_trip_duration_avg": 0.0, "vus_max": 30.0}}, "Python_Cryptography": {"1": {"payload_bytes": 1, "iterations": 7264, "http_req_duration_med": 185.7323, "http_req_duration_p90": 396.03954000000004, "http_req_duration_p95": 475.00082, "http_req_duration_avg": 180.39896727923502, "http_reqs_rate": 69.15270022681844, "http_req_failed_rate": 0.0, "iteration_duration_avg": 461.4064292538567, "round_trip_duration_avg": 361.0556167400881, "vus_max": 30.0}, "10485760": {"payload_bytes": 10485760, "iterations": 147, "http_req_duration_med": 7933.1224, "http_req_duration_p90": 29410.89717, "http_req_duration_p95": 32878.912764999994, "http_req_duration_avg": 12389.568287919461, "http_reqs_rate": 1.3395122480170072, "http_req_failed_rate": 0.0, "iteration_duration_avg": 25243.64307551021, "round_trip_duration_avg": 25143.21768707483, "vus_max": 30.0}, "104857600": {"payload_bytes": 104857600, "iterations": 97, "http_req_duration_med": 0.0, "http_req_duration_p90": 0.0, "http_req_duration_p95": 25735.40128, "http_req_duration_avg": 2440.684128, "http_reqs_rate": 0.41367321267777757, "http_req_failed_rate": 0.0, "iteration_duration_avg": 30105.339079381443, "round_trip_duration_avg": 0.0, "vus_max": 30.0}}, "Python_PyCryptodome": {"1": {"payload_bytes": 1, "iterations": 1101, "http_req_duration_med": 571.8188, "http_req_duration_p90": 4499.00338, "http_req_duration_p95": 5703.96881, "http_req_duration_avg": 1499.1147953245563, "http_reqs_rate": 10.485104197269786, "http_req_failed_rate": 0.0, "iteration_duration_avg": 3100.55358119891, "round_trip_duration_avg": 3000.088101725704, "vus_max": 30.0}, "10485760": {"payload_bytes": 10485760, "iterations": 90, "http_req_duration_med": 6471.0135, "http_req_duration_p90": 57833.35112, "http_req_duration_p95": 67466.0306, "http_req_duration_avg": 17481.427622842642, "http_reqs_rate": 0.823471170542888, "http_req_failed_rate": 0.0, "iteration_duration_avg": 30972.611145555547, "round_trip_duration_avg": 31001.3488372093, "vus_max": 30.0}, "104857600": {"payload_bytes": 104857600, "iterations": 92, "http_req_duration_med": 0.0, "http_req_duration_p90": 22701.0638, "http_req_duration_p95": 23301.84446, "http_req_duration_avg": 3720.5750849462365, "http_reqs_rate": 0.38001788424639227, "http_req_failed_rate": 0.0, "iteration_duration_avg": 28824.104489130423, "round_trip_duration_avg": 0.0, "vus_max": 30.0}}};
const libraries = ["CPP_CryptoPP", "CPP_OpenSSL", "Python_Cryptography", "Python_PyCryptodome"];

const payloadLabels = {'1': '1B', '10485760': '10MB', '104857600': '100MB'};

let activeLibrary = libraries[0] || null;

function getPayloadLabel(payload) {
  return payloadLabels[String(payload)] || payload + 'B';
}

function buildLibrarySelector() {
  const select = document.getElementById('librarySelect');
  select.innerHTML = '';
  
  libraries.forEach((lib) => {
    const option = document.createElement('option');
    option.value = lib;
    option.textContent = lib;
    if (lib === activeLibrary) option.selected = true;
    select.appendChild(option);
  });
  
  select.onchange = (e) => {
    activeLibrary = e.target.value;
    refresh();
  };
}

function renderContent() {
  const container = document.getElementById('contentContainer');
  container.innerHTML = '';
  
  if (!activeLibrary || !allResults[activeLibrary]) {
    container.innerHTML = '<div class="card">Brak danych dla wybranej biblioteki.</div>';
    return;
  }
  
  const libraryData = allResults[activeLibrary];
  const payloads = Object.keys(libraryData).map(p => parseInt(p)).sort((a, b) => a - b);
  
  document.getElementById('payloadBadge').textContent = 
    'Payloads: ' + payloads.map(getPayloadLabel).join(', ');
  
  const tableRows = payloads.map((payload) => {
    const data = libraryData[String(payload)];
    const payloadLabel = getPayloadLabel(payload);
    
    const failPct = data.http_req_failed_rate * 100;
    const failClass = failPct < 1 ? 'metric-good' : (failPct < 5 ? 'metric-warn' : 'metric-bad');
    
    return `
      <tr>
        <td><strong>${payloadLabel}</strong></td>
        <td>${data.iterations}</td>
        <td>${Math.round(data.vus_max)}</td>
        <td>${data.http_req_duration_med.toFixed(2)}</td>
        <td>${data.http_req_duration_p90.toFixed(2)}</td>
        <td>${data.http_req_duration_p95.toFixed(2)}</td>
        <td>${data.http_req_duration_avg.toFixed(2)}</td>
        <td>${data.http_reqs_rate.toFixed(2)}</td>
        <td>${data.iteration_duration_avg.toFixed(2)}</td>
        <td>${data.round_trip_duration_avg.toFixed(2)}</td>
        <td class="${failClass}">${failPct.toFixed(4)}%</td>
      </tr>
    `;
  }).join('');
  
  const section = document.createElement('section');
  section.className = 'payload-section';
  section.innerHTML = `
    <div class="card">
      <h2>Wyniki skalowalności</h2>
      <table>
        <thead>
          <tr>
            <th>Payload</th>
            <th>Iteracje</th>
            <th>Max VU</th>
            <th>Med [ms]</th>
            <th>p90 [ms]</th>
            <th>p95 [ms]</th>
            <th>Avg [ms]</th>
            <th>Throughput [req/s]</th>
            <th>Iteration avg [ms]</th>
            <th>RTT avg [ms]</th>
            <th>Fail [%]</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>
    <div class="card chart-card">
      <h2>Latencja (p50/p95/p99/avg)</h2>
      <canvas id="latencyChart"></canvas>
    </div>
    <div class="card chart-card">
      <h2>Iteration Duration vs Round Trip Time</h2>
      <canvas id="cryptoChart"></canvas>
    </div>
  `;
  container.appendChild(section);

  renderCharts(payloads, libraryData);
}

let latencyChart;
let cryptoChart;

function renderCharts(payloads, libraryData) {
  const labels = payloads.map(getPayloadLabel);
  const med = payloads.map((payload) => libraryData[String(payload)].http_req_duration_med || 0);
  const p90 = payloads.map((payload) => libraryData[String(payload)].http_req_duration_p90 || 0);
  const p95 = payloads.map((payload) => libraryData[String(payload)].http_req_duration_p95 || 0);
  const avg = payloads.map((payload) => libraryData[String(payload)].http_req_duration_avg || 0);
  const iterDuration = payloads.map((payload) => libraryData[String(payload)].iteration_duration_avg || 0);
  const rttDuration = payloads.map((payload) => libraryData[String(payload)].round_trip_duration_avg || 0);

  const latencyCanvas = document.getElementById('latencyChart');
  const cryptoCanvas = document.getElementById('cryptoChart');

  if (latencyChart) latencyChart.destroy();
  if (cryptoChart) cryptoChart.destroy();

  latencyChart = new Chart(latencyCanvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Med [ms]', data: med, backgroundColor: 'rgba(45, 91, 138, 0.6)' },
        { label: 'p90 [ms]', data: p90, backgroundColor: 'rgba(28, 124, 125, 0.6)' },
        { label: 'p95 [ms]', data: p95, backgroundColor: 'rgba(165, 124, 27, 0.6)' },
        { label: 'Avg [ms]', data: avg, backgroundColor: 'rgba(93, 102, 114, 0.6)' },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });

  cryptoChart = new Chart(cryptoCanvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Iteration Duration [ms]', data: iterDuration, backgroundColor: 'rgba(28, 124, 125, 0.6)' },
        { label: 'Round Trip Time [ms]', data: rttDuration, backgroundColor: 'rgba(193, 72, 46, 0.6)' },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

function refresh() {
  buildLibrarySelector();
  renderContent();
}

refresh();
</script>
</body>
</html>
