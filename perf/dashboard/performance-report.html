<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance Report Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f5f2ea;
      --ink: #1b1f24;
      --muted: #5d6672;
      --panel: #fffdf8;
      --line: #e9e2d3;
      --shadow: 0 14px 32px rgba(39, 33, 18, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 0% 0%, #ece7db 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, #efe9da 0%, transparent 35%),
        var(--bg);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 16px 40px; }
    .hero {
      background: linear-gradient(120deg, #fcf6e7 0%, #fffdf7 40%, #eef6f5 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 2.5vw, 2rem); }
    .subtitle { margin: 0; color: var(--muted); }
    .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 16px 0 0; }
    .control-group { display: flex; gap: 10px; align-items: center; }
    .control-group label { font-weight: 600; }
    select {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
    .badge { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: inline-block; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .card {
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 16px; font-size: 1.1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: rgba(27, 31, 36, 0.05); font-weight: 600; }
    tr:hover { background: rgba(27, 31, 36, 0.02); }
    .metric-good { color: #1c7c7d; font-weight: 600; }
    .metric-warn { color: #a57c1b; font-weight: 600; }
    .metric-bad { color: #c1482e; font-weight: 600; }
    .payload-section { margin-bottom: 24px; }
    .chart-card { padding: 12px 16px 6px; }
    canvas { max-height: 320px; }
    @media (max-width: 900px) {
      th, td { padding: 8px; font-size: 12px; }
      .controls { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Performance Test Report</h1>
      <p class="subtitle">Wyniki testu wydajności dla wybranej biblioteki</p>
      <div class="controls">
        <div class="control-group">
          <label for="librarySelect">Biblioteka:</label>
          <select id="librarySelect"></select>
        </div>
        <span class="badge" id="payloadBadge">Payloads: -</span>
      </div>
    </section>

    <div class="grid" id="contentContainer">
      <!-- Dynamicznie generowane -->
    </div>
  </div>

<script>
const allResults = {"CPP_CryptoPP": {"1": {"payload_bytes": 1, "iterations": 8841, "http_req_duration_p50": 0.0, "http_req_duration_p95": 50.09096999999999, "http_req_duration_p99": 0.0, "http_req_duration_avg": 17.484385477577387, "http_reqs_rate": 294.0584095653943, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 4.909737801153701, "decrypt_duration_avg": 30.0605066960751}, "10485760": {"payload_bytes": 10485760, "iterations": 39, "http_req_duration_p50": 0.0, "http_req_duration_p95": 4204.44424, "http_req_duration_p99": 0.0, "http_req_duration_avg": 3526.9185670886063, "http_reqs_rate": 1.255437219138035, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 3674.5618256410257, "decrypt_duration_avg": 3469.6487487179484}, "104857600": {"payload_bytes": 104857600, "iterations": 2, "http_req_duration_p50": 0.0, "http_req_duration_p95": 13021.33456, "http_req_duration_p99": 0.0, "http_req_duration_avg": 9773.87848, "http_reqs_rate": 0.07952561772959009, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 11695.823049999999, "decrypt_duration_avg": 12737.631099999999}}, "CPP_OpenSSL": {"1": {"payload_bytes": 1, "iterations": 9115, "http_req_duration_p50": 0.0, "http_req_duration_p95": 47.63735, "http_req_duration_p99": 0.0, "http_req_duration_avg": 15.457273994843899, "http_reqs_rate": 303.0470127946495, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 2.826012517827761, "decrypt_duration_avg": 28.088172737246296}, "10485760": {"payload_bytes": 10485760, "iterations": 43, "http_req_duration_p50": 0.0, "http_req_duration_p95": 3928.72841, "http_req_duration_p99": 0.0, "http_req_duration_avg": 3274.8814988505756, "http_reqs_rate": 1.3392941694048472, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 3492.9287116279065, "decrypt_duration_avg": 3132.9338069767446}, "104857600": {"payload_bytes": 104857600, "iterations": 3, "http_req_duration_p50": 0.0, "http_req_duration_p95": 10959.20035, "http_req_duration_p99": 0.0, "http_req_duration_avg": 9207.9599, "http_reqs_rate": 0.08372382494069187, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 10569.238133333334, "decrypt_duration_avg": 10915.172533333332}}, "Python_Cryptography": {"1": {"payload_bytes": 1, "iterations": 1864, "http_req_duration_p50": 0.0, "http_req_duration_p95": 476.66185999999993, "http_req_duration_p99": 0.0, "http_req_duration_avg": 273.20895320461244, "http_reqs_rate": 61.56006344816953, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 319.2601121244633, "decrypt_duration_avg": 227.22104152360512}, "10485760": {"payload_bytes": 10485760, "iterations": 50, "http_req_duration_p50": 0.0, "http_req_duration_p95": 3890.2876, "http_req_duration_p99": 0.0, "http_req_duration_avg": 2843.126138613861, "http_reqs_rate": 1.5361624099281816, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 3121.8596839999996, "decrypt_duration_avg": 2621.149322}, "104857600": {"payload_bytes": 104857600, "iterations": 2, "http_req_duration_p50": 0.0, "http_req_duration_p95": 18567.803079999998, "http_req_duration_p99": 0.0, "http_req_duration_avg": 12114.29558, "http_reqs_rate": 0.06714070610234318, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 17025.66475, "decrypt_duration_avg": 13227.448049999999}}, "Python_PyCryptodome": {"1": {"payload_bytes": 1, "iterations": 255, "http_req_duration_p50": 0.0, "http_req_duration_p95": 5245.93505, "http_req_duration_p99": 0.0, "http_req_duration_avg": 2345.9175201565527, "http_reqs_rate": 8.236851101535134, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 2836.255591764706, "decrypt_duration_avg": 1864.6465576470582}, "10485760": {"payload_bytes": 10485760, "iterations": 50, "http_req_duration_p50": 0.0, "http_req_duration_p95": 3898.4091, "http_req_duration_p99": 0.0, "http_req_duration_avg": 2783.091010891089, "http_reqs_rate": 1.5755088675254738, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 2900.2205300000005, "decrypt_duration_avg": 2720.504604}, "104857600": {"payload_bytes": 104857600, "iterations": 2, "http_req_duration_p50": 0.0, "http_req_duration_p95": 16504.25704, "http_req_duration_p99": 0.0, "http_req_duration_avg": 12195.769260000001, "http_reqs_rate": 0.06715463137972658, "http_req_failed_rate": 0.0, "encrypt_duration_avg": 16225.835350000001, "decrypt_duration_avg": 14252.1944}}};
const libraries = ["CPP_CryptoPP", "CPP_OpenSSL", "Python_Cryptography", "Python_PyCryptodome"];

const payloadLabels = {'1': '1B', '10485760': '10MB', '104857600': '100MB'};

let activeLibrary = libraries[0] || null;

function getPayloadLabel(payload) {
  return payloadLabels[String(payload)] || payload + 'B';
}

function buildLibrarySelector() {
  const select = document.getElementById('librarySelect');
  select.innerHTML = '';
  
  libraries.forEach((lib) => {
    const option = document.createElement('option');
    option.value = lib;
    option.textContent = lib;
    if (lib === activeLibrary) option.selected = true;
    select.appendChild(option);
  });
  
  select.onchange = (e) => {
    activeLibrary = e.target.value;
    refresh();
  };
}

let chartInstance;

function renderChart(payloads, libraryData) {
  const labels = payloads.map(getPayloadLabel);
  const encryptData = payloads.map((payload) => libraryData[String(payload)].encrypt_duration_avg || 0);
  const decryptData = payloads.map((payload) => libraryData[String(payload)].decrypt_duration_avg || 0);

  const canvas = document.getElementById('encryptDecryptChart');
  if (!canvas) return;

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Encrypt avg [ms]',
          data: encryptData,
          backgroundColor: 'rgba(28, 124, 125, 0.6)'
        },
        {
          label: 'Decrypt avg [ms]',
          data: decryptData,
          backgroundColor: 'rgba(193, 72, 46, 0.6)'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { position: 'top' }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

function renderContent() {
  const container = document.getElementById('contentContainer');
  container.innerHTML = '';
  
  if (!activeLibrary || !allResults[activeLibrary]) {
    container.innerHTML = '<div class="card">Brak danych dla wybranej biblioteki.</div>';
    return;
  }
  
  const libraryData = allResults[activeLibrary];
  const payloads = Object.keys(libraryData).map(p => parseInt(p)).sort((a, b) => a - b);
  
  document.getElementById('payloadBadge').textContent = 
    'Payloads: ' + payloads.map(getPayloadLabel).join(', ');
  
  const tableRows = payloads.map((payload) => {
    const data = libraryData[String(payload)];
    const payloadLabel = getPayloadLabel(payload);
    
    const failPct = data.http_req_failed_rate * 100;
    const failClass = failPct < 1 ? 'metric-good' : (failPct < 5 ? 'metric-warn' : 'metric-bad');
    
    return `
      <tr>
        <td><strong>${payloadLabel}</strong></td>
        <td>${data.iterations}</td>
        <td>${data.http_req_duration_p50.toFixed(2)}</td>
        <td>${data.http_req_duration_p95.toFixed(2)}</td>
        <td>${data.http_req_duration_p99.toFixed(2)}</td>
        <td>${data.http_req_duration_avg.toFixed(2)}</td>
        <td>${data.http_reqs_rate.toFixed(2)}</td>
        <td>${data.encrypt_duration_avg.toFixed(2)}</td>
        <td>${data.decrypt_duration_avg.toFixed(2)}</td>
        <td class="${failClass}">${failPct.toFixed(4)}%</td>
      </tr>
    `;
  }).join('');
  
  const section = document.createElement('section');
  section.className = 'payload-section';
  section.innerHTML = `
    <div class="card">
      <h2>Wyniki wydajności</h2>
      <table>
        <thead>
          <tr>
            <th>Payload</th>
            <th>Iteracje</th>
            <th>p50 [ms]</th>
            <th>p95 [ms]</th>
            <th>p99 [ms]</th>
            <th>Avg [ms]</th>
            <th>Throughput [req/s]</th>
            <th>Encrypt avg [ms]</th>
            <th>Decrypt avg [ms]</th>
            <th>Fail [%]</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>
    <div class="card chart-card">
      <h2>Sredni czas szyfrowania i deszyfrowania</h2>
      <canvas id="encryptDecryptChart"></canvas>
    </div>
  `;
  container.appendChild(section);

  renderChart(payloads, libraryData);
}

function refresh() {
  buildLibrarySelector();
  renderContent();
}

refresh();
</script>
</body>
</html>
